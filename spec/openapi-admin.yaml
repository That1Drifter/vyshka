openapi: 3.1.0
info:
  title: Vyshka Admin API
  version: 0.7.0
  summary: Operator-facing API of the Vyshka hub.
  description: |
    The operator half of the Vyshka protocol. Normative text lives in
    `spec/protocol.md`; this document is its machine-readable companion and
    covers only the endpoints implemented so far (spec sections 5.1, 5.5,
    6.5, and 7).

    Authentication is a bearer token. Until scoped tokens land (spec section
    10), a hub accepts a single bootstrap admin token that carries the `admin`
    scope.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:8080
    description: A hub running locally with default settings.

security:
  - adminToken: []

tags:
  - name: servers
    description: Game server records, enrollment tokens, and credentials.
  - name: envelopes
    description: Putting work on a server's queue.
  - name: actions
    description: Dispatching tracked jobs and reading their lifecycle.

paths:
  /api/v1/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: List server records, newest first.
      responses:
        "200":
          description: Every server record this hub knows.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/ServerRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [servers]
      operationId: createServer
      summary: Create a server record and mint its first enrollment token.
      description: |
        The enrollment token is returned in this response and is not
        retrievable afterwards: the hub stores only a digest of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Operator-facing label for the game server.
                game:
                  type: string
                  maxLength: 64
                  description: |
                    Game the operator expects to enroll here, lowercase.
                    Omit to accept whatever enrolls. A mismatching enrollment
                    is rejected with `game_mismatch`.
                  examples: [dayz, reforger]
                enrollmentTokenTtlSeconds:
                  type: integer
                  minimum: 1
                  default: 86400
                  description: Requested lifetime of the enrollment token; the hub may clamp it.
            example:
              name: "Chernarus #1"
              game: dayz
      responses:
        "201":
          description: The record, plus the one-time enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [server, enrollment]
                properties:
                  server: { $ref: "#/components/schemas/ServerRecord" }
                  enrollment: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [servers]
      operationId: getServer
      summary: Read one server record.
      responses:
        "200":
          description: The server record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/enrollment-token:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [servers]
      operationId: issueEnrollmentToken
      summary: Mint a replacement enrollment token.
      description: |
        Invalidates any unused enrollment token the server still had. This is
        how an operator recovers a server whose secret was lost or revoked.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 1
                  default: 86400
      responses:
        "201":
          description: The new one-time enrollment token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/credentials:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    delete:
      tags: [servers]
      operationId: revokeServerCredentials
      summary: Revoke a server's secret and end its sessions.
      description: |
        Takes effect immediately: a long-poll already held open is answered
        with `401 session_invalid` rather than left to expire (spec section
        5.4). Idempotent.
      responses:
        "204":
          description: The credentials are revoked and no session survives.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/envelopes:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [envelopes]
      operationId: queueEnvelope
      summary: Queue one envelope for a server.
      description: |
        The transport-level primitive. Everything the hub models itself (action
        dispatch) is queued the same way, through an endpoint that validates
        what it is queueing, so this one refuses the types those endpoints own.

        Queueing does not need a live session: an envelope queued while the game
        server is down is delivered on its next session, renumbered into that
        session's sequence space (spec section 9.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: |
                    Namespaced message type, non-empty after trimming. Type
                    families the hub itself models (`action.*`, `manifest.*`)
                    are refused here with `conflict`.
                body:
                  type: object
                  additionalProperties: true
                  default: {}
            example:
              type: example-mod.reload
              body: { modules: [loot] }
      responses:
        "202":
          description: |
            Queued. The hub assigned an `id` and a `ts`; the `seq` is assigned
            on delivery, because sequence numbers belong to a session.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    type: object
                    required: [id, type, ts]
                    properties:
                      id: { type: string }
                      type: { type: string }
                      ts: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The type belongs to a dedicated endpoint (`conflict`), or the
            server's queue is at its bound (`outbound_queue_full`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/servers/{serverId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [servers]
      operationId: getServerManifest
      summary: Read the server's stored manifest.
      description: |
        The accepted `manifest.publish` body, verbatim, with the hub's metadata
        beside it (spec section 6.5). 404 covers an unknown server and a server
        that has never had a manifest accepted alike.
      responses:
        "200":
          description: The stored manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifestRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/actions:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [actions]
      operationId: dispatchAction
      summary: Dispatch an action to a server.
      description: |
        Validated against the server's stored manifest before anything is
        queued: the code must be declared there and params must satisfy its
        schema, so schema-invalid input never reaches the game server (spec
        section 7). A retry with the same `idempotencyKey` returns the
        original actionId instead of double-queueing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: A code the server's manifest declares.
                context:
                  type: string
                  description: The context the action targets.
                referenceKey:
                  type: string
                  maxLength: 200
                  description: The entity within the context, such as a player id.
                params:
                  type: object
                  additionalProperties: true
                  default: {}
                  description: Validated against the declared schema.
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 120
                  description: Deadline for reaching a terminal state; clamped into range.
                idempotencyKey:
                  type: string
                  maxLength: 200
            example:
              code: example-mod.heal
              context: player
              referenceKey: "76561198000000000"
              params: { amount: 100 }
      responses:
        "202":
          description: Queued as a tracked job.
          content:
            application/json:
              schema:
                type: object
                required: [actionId, state]
                properties:
                  actionId: { type: string }
                  state:
                    type: string
                    description: |
                      `queued` for a fresh dispatch; an idempotent retry
                      reports the original action's current state.
        "400":
          description: |
            Malformed body (`bad_request`), or params failing the declared
            schema (`params_invalid`, with `details.errors` listing
            `{ path, message }` faults).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The manifest does not declare the code, or no manifest was ever
            accepted (`unknown_action`); or the server's queue is at its bound
            (`outbound_queue_full`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/actions/{actionId}:
    get:
      tags: [actions]
      operationId: getAction
      summary: Read one action's full lifecycle record.
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The action record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: An admin token (spec section 10).

  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      description: Hub-assigned server id; opaque to clients.
      schema:
        type: string

  schemas:
    ServerRecord:
      type: object
      description: A game server as the Admin API sees it. Never carries a credential.
      required:
        [id, name, game, createdAt, credentialState, lastSeenAt, pendingEnvelopeCount]
      properties:
        id: { type: string }
        name: { type: string }
        game: { type: string }
        createdAt: { type: string, format: date-time }
        enrolledAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        revokedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        credentialState:
          type: string
          enum: [none, active, revoked]
        lastSeenAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
          description: When the plugin last authenticated or polled.
        pendingEnvelopeCount:
          type: integer
          minimum: 0
          description: |
            Envelopes queued for this server and not yet acked. The operator's
            view of a link that has stopped draining (spec section 9.4).
        plugin:
          oneOf: [{ $ref: "#/components/schemas/PluginDescriptor" }, { type: "null" }]
        session:
          oneOf: [{ $ref: "#/components/schemas/SessionSummary" }, { type: "null" }]

    PluginDescriptor:
      type: object
      description: What the plugin last said about itself. Advisory.
      properties:
        name: { type: string }
        version: { type: string }
        transports:
          type: array
          items: { type: string }

    SessionSummary:
      type: object
      description: The server's live session, or null when it has none.
      required: [id, expiresAt, pollTimeoutSeconds]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        pollTimeoutSeconds: { type: integer }

    ManifestRecord:
      type: object
      description: A server's stored manifest (spec section 6.5).
      required: [revision, publishedAt, manifest]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The accepted manifestRevision.
        publishedAt: { type: string, format: date-time }
        manifest:
          type: object
          additionalProperties: true
          description: |
            The accepted manifest.publish body, verbatim. Its shape is
            `manifest.schema.json#/$defs/manifestPublish`.

    ActionRecord:
      type: object
      description: One tracked job and everything that happened to it (spec section 7).
      required: [id, serverId, code, params, state, createdAt, expiresAt]
      properties:
        id: { type: string }
        serverId: { type: string }
        code: { type: string }
        context: { type: string }
        referenceKey: { type: string }
        params:
          type: object
          additionalProperties: true
        idempotencyKey: { type: string }
        state:
          type: string
          enum: [queued, delivered, running, completed, failed, expired]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        deliveredAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        runningAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        finishedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        ok:
          oneOf: [{ type: boolean }, { type: "null" }]
          description: Null until an action.result landed.
        result:
          description: The result payload the plugin reported, or null.
        error:
          oneOf: [{ type: string }, { type: "null" }]
        durationMs:
          oneOf: [{ type: integer }, { type: "null" }]

    EnrollmentToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: One-time enrollment token. Returned once, never retrievable again.
        expiresAt: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier; branch on this.
            message:
              type: string
              description: Human-readable. Never parse it.
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Malformed body, or a field missing, wrongly typed, or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid admin token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
