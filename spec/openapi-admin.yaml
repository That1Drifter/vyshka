openapi: 3.1.0
info:
  title: Vyshka Admin API
  version: 0.9.0
  summary: Operator-facing API of the Vyshka hub.
  description: |
    The operator half of the Vyshka protocol. Normative text lives in
    `spec/protocol.md`; this document is its machine-readable companion and
    covers only the endpoints implemented so far (spec sections 5.1, 5.5,
    6.5, 7, 8.5, and 10).

    Authentication is a bearer token carrying explicit scopes (spec section
    10). The scope each endpoint requires is stated in its description; where
    it depends on a value in the request, such as the action code being
    dispatched, the hub checks that value rather than the route alone. A hub
    MAY also accept one bootstrap token carrying `admin`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:8080
    description: A hub running locally with default settings.

security:
  - adminToken: []

tags:
  - name: servers
    description: Game server records, enrollment tokens, and credentials.
  - name: envelopes
    description: Putting work on a server's queue.
  - name: actions
    description: Dispatching tracked jobs and reading their lifecycle.
  - name: events
    description: Reading the telemetry a plugin has pushed.
  - name: tokens
    description: Minting, listing, and revoking scoped Admin API credentials.
  - name: audit
    description: Reading the record of every authenticated mutation.

paths:
  /api/v1/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: List server records, newest first.
      responses:
        "200":
          description: Every server record this hub knows.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/ServerRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [servers]
      operationId: createServer
      summary: Create a server record and mint its first enrollment token.
      description: |
        The enrollment token is returned in this response and is not
        retrievable afterwards: the hub stores only a digest of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Operator-facing label for the game server.
                game:
                  type: string
                  maxLength: 64
                  description: |
                    Game the operator expects to enroll here, lowercase.
                    Omit to accept whatever enrolls. A mismatching enrollment
                    is rejected with `game_mismatch`.
                  examples: [dayz, reforger]
                enrollmentTokenTtlSeconds:
                  type: integer
                  minimum: 1
                  default: 86400
                  description: Requested lifetime of the enrollment token; the hub may clamp it.
            example:
              name: "Chernarus #1"
              game: dayz
      responses:
        "201":
          description: The record, plus the one-time enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [server, enrollment]
                properties:
                  server: { $ref: "#/components/schemas/ServerRecord" }
                  enrollment: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [servers]
      operationId: getServer
      summary: Read one server record.
      responses:
        "200":
          description: The server record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/enrollment-token:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [servers]
      operationId: issueEnrollmentToken
      summary: Mint a replacement enrollment token.
      description: |
        Invalidates any unused enrollment token the server still had. This is
        how an operator recovers a server whose secret was lost or revoked.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 1
                  default: 86400
      responses:
        "201":
          description: The new one-time enrollment token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/credentials:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    delete:
      tags: [servers]
      operationId: revokeServerCredentials
      summary: Revoke a server's secret and end its sessions.
      description: |
        Takes effect immediately: a long-poll already held open is answered
        with `401 session_invalid` rather than left to expire (spec section
        5.4). Idempotent.
      responses:
        "204":
          description: The credentials are revoked and no session survives.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/envelopes:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [envelopes]
      operationId: queueEnvelope
      summary: Queue one envelope for a server.
      description: |
        The transport-level primitive. Everything the hub models itself (action
        dispatch) is queued the same way, through an endpoint that validates
        what it is queueing, so this one refuses the types those endpoints own.

        Queueing does not need a live session: an envelope queued while the game
        server is down is delivered on its next session, renumbered into that
        session's sequence space (spec section 9.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: |
                    Namespaced message type, non-empty after trimming. Type
                    families the hub itself models (`action.*`, `manifest.*`)
                    are refused here with `conflict`.
                body:
                  type: object
                  additionalProperties: true
                  default: {}
            example:
              type: example-mod.reload
              body: { modules: [loot] }
      responses:
        "202":
          description: |
            Queued. The hub assigned an `id` and a `ts`; the `seq` is assigned
            on delivery, because sequence numbers belong to a session.
          content:
            application/json:
              schema:
                type: object
                required: [envelope]
                properties:
                  envelope:
                    type: object
                    required: [id, type, ts]
                    properties:
                      id: { type: string }
                      type: { type: string }
                      ts: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The type belongs to a dedicated endpoint (`conflict`), or the
            server's queue is at its bound (`outbound_queue_full`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/servers/{serverId}/manifest:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [servers]
      operationId: getServerManifest
      summary: Read the server's stored manifest.
      description: |
        The accepted `manifest.publish` body, verbatim, with the hub's metadata
        beside it (spec section 6.5). 404 covers an unknown server and a server
        that has never had a manifest accepted alike.
      responses:
        "200":
          description: The stored manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifestRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/actions:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [actions]
      operationId: dispatchAction
      summary: Dispatch an action to a server.
      description: |
        Validated against the server's stored manifest before anything is
        queued: the code must be declared there and params must satisfy its
        schema, so schema-invalid input never reaches the game server (spec
        section 7). A retry with the same `idempotencyKey` returns the
        original actionId instead of double-queueing.

        Requires `actions:dispatch` covering the requested `code`. That check
        runs before both the manifest lookup and the idempotency lookup, so
        neither can be used to learn about an action the token may not
        dispatch (spec section 10.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: A code the server's manifest declares.
                context:
                  type: string
                  description: The context the action targets.
                referenceKey:
                  type: string
                  maxLength: 200
                  description: The entity within the context, such as a player id.
                params:
                  type: object
                  additionalProperties: true
                  default: {}
                  description: Validated against the declared schema.
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 120
                  description: Deadline for reaching a terminal state; clamped into range.
                idempotencyKey:
                  type: string
                  maxLength: 200
            example:
              code: example-mod.heal
              context: player
              referenceKey: "76561198000000000"
              params: { amount: 100 }
      responses:
        "202":
          description: Queued as a tracked job.
          content:
            application/json:
              schema:
                type: object
                required: [actionId, state]
                properties:
                  actionId: { type: string }
                  state:
                    type: string
                    description: |
                      `queued` for a fresh dispatch; an idempotent retry
                      reports the original action's current state.
        "400":
          description: |
            Malformed body (`bad_request`), or params failing the declared
            schema (`params_invalid`, with `details.errors` listing
            `{ path, message }` faults).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The manifest does not declare the code, or no manifest was ever
            accepted (`unknown_action`); or the server's queue is at its bound
            (`outbound_queue_full`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/actions/{actionId}:
    get:
      tags: [actions]
      operationId: getAction
      summary: Read one action's full lifecycle record.
      description: |
        Requires `actions:read` covering the action's own code, which
        `actions:dispatch` over the same pattern implies (spec section 10.1).
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The action record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/servers/{serverId}/events:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [events]
      operationId: listEvents
      summary: Read a server's telemetry feed, newest first.
      description: |
        One page of the append-only event store (spec section 8.5). Core and
        custom events come back through the same query and the same filters:
        nothing here distinguishes them.
      parameters:
        - name: type
          in: query
          required: false
          description: |
            An exact event type, a `{namespace}.*` pattern, or `*`. Repeatable;
            terms are ORed. Absent means every type.
          schema:
            type: array
            items:
              type: string
              pattern: "^(\\*|[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*(\\.\\*)?)$"
          style: form
          explode: true
          example: ["core.player.*", "example-mod.raid.started"]
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: Exclusive upper bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to the hub's cap rather than refused.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: An opaque nextCursor from a previous page. Never parse or construct one.
          schema: { type: string }
      responses:
        "200":
          description: |
            One page of the feed. A token narrowed by an
            `events:read:{pattern}` scope sees only what that scope covers:
            an absent `type` is narrowed to the grant rather than answered
            with the whole feed (spec section 10.3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            An explicit `type` term the token's `events:read` grant does not
            cover. Refused rather than narrowed, because a narrowed answer to
            an explicit filter looks exactly like a complete one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List Admin API token records, newest first.
      description: |
        Requires `admin`. Revoked and expired records are included: an
        operator auditing access needs to see what used to exist. No response
        other than the mint ever carries a secret.
      responses:
        "200":
          description: Every token record this hub knows.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/AdminTokenRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Mint a scoped Admin API token.
      description: |
        Requires `admin`. The secret is returned in this response and is not
        retrievable afterwards: the hub stores only a digest of it. A hub MUST
        NOT mint a token carrying a scope its minter does not itself hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Operator-facing label, recorded on every audit entry this token writes.
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: { $ref: "#/components/schemas/Scope" }
                  description: |
                    Grants, in the closed grammar of spec section 10.1. A scope
                    the hub does not define is refused here rather than stored.
                expiresInSeconds:
                  type: integer
                  minimum: 0
                  description: |
                    Absent or zero mints a token that does not expire on its
                    own. A hub MAY clamp a very short request up to a floor
                    (reference floor: 60).
            example:
              name: panel
              scopes: ["servers:read", "events:read:example-mod.*"]
              expiresInSeconds: 2592000
      responses:
        "201":
          description: The token record and its secret.
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: "#/components/schemas/AdminTokenRecord" }
                  secret:
                    type: string
                    description: Returned here and nowhere else, ever.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{tokenId}:
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a token.
      description: |
        Requires `admin`. Revocation takes effect on the next request. The
        record survives, so the audit log's references to it keep resolving;
        revoking twice is idempotent and does not move the recorded time.

        A bootstrap credential has no record and so cannot be revoked here. It
        is retired by removing it from the hub's configuration and restarting.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Read the audit log, newest first.
      description: |
        Requires `admin`: the log names every credential and everything each
        one changed, so a token that could read it could map the whole
        installation. Every authenticated mutation appears here, successful or
        refused; reads do not (spec section 10.5).
      parameters:
        - name: tokenId
          in: query
          required: false
          description: Only entries written by this credential.
          schema: { type: string }
        - name: serverId
          in: query
          required: false
          description: Only entries against this server.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on `at`.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: Exclusive upper bound on `at`.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to the hub's cap rather than refused.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: An opaque nextCursor from a previous page. Never parse or construct one.
          schema: { type: string }
      responses:
        "200":
          description: One page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List registered webhooks, newest first.
      description: |
        Requires `webhooks:manage`. No response other than the registration
        ever carries a signing secret.
      responses:
        "200":
          description: Every registered webhook.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Register a webhook.
      description: |
        Requires `webhooks:manage`, plus grants covering what the filter
        subscribes to (spec section 11.2): a webhook is a standing export of
        what it matches, so `events:read` coverage is required for telemetry
        patterns, `actions:read` for a filter admitting `action.completed`,
        and `servers:read` for the link notifications or a named serverIds
        list. The signing secret is minted by the hub and returned in this
        response only; the hub keeps the secret itself, because signing needs
        it, so database access is secret access. A webhook observes only what
        lands after registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
                  description: The http(s) target deliveries are POSTed to.
                events:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/EventPattern" }
                  description: |
                    Type patterns in the spec section 10.1 grammar. Absent or
                    empty means every type. A pattern outside the grammar is
                    refused, never a filter that silently matches nothing.
                serverIds:
                  type: array
                  maxItems: 50
                  items: { type: string }
                  description: |
                    Exact server ids the webhook observes; absent or empty
                    means every server. An id naming no server is refused.
                template:
                  type: string
                  enum: [generic-json]
                  default: generic-json
                  description: |
                    The delivery body shape. `discord` is reserved for a
                    future draft; an unimplemented template is refused.
            example:
              url: https://example.net/hooks/vyshka
              events: ["core.player.*", "action.completed"]
              serverIds: []
              template: generic-json
      responses:
        "201":
          description: The webhook record and its signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: { $ref: "#/components/schemas/WebhookRecord" }
                  secret:
                    type: string
                    description: The HMAC-SHA256 signing key. Returned here and nowhere else.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Missing `webhooks:manage`, or the token's grants do not cover what
            the filter subscribes to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: A serverIds entry names no server this hub knows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook.
      description: |
        Requires `webhooks:manage`. The webhook's pending deliveries are
        abandoned with it (spec section 11.2).
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/{webhookId}/deliveries:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Read a webhook's delivery record, newest first.
      description: |
        Requires `webhooks:manage`. This is the visible counter of spec
        section 11.5: pending, delivered, and dead deliveries alike, with
        attempt counts and last failures.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to the hub's cap rather than refused.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The most recent deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: An admin token (spec section 10).

  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      description: Hub-assigned server id; opaque to clients.
      schema:
        type: string

  schemas:
    ServerRecord:
      type: object
      description: A game server as the Admin API sees it. Never carries a credential.
      required:
        [id, name, game, createdAt, credentialState, lastSeenAt, linkState, pendingEnvelopeCount]
      properties:
        id: { type: string }
        name: { type: string }
        game: { type: string }
        createdAt: { type: string, format: date-time }
        enrolledAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        revokedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        credentialState:
          type: string
          enum: [none, active, revoked]
        lastSeenAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
          description: When the plugin last authenticated or polled.
        linkState:
          type: string
          enum: [unknown, up, down]
          description: |
            The link monitor's classification (spec section 11.1): unknown
            until a session has been observed, then up or down.
        pendingEnvelopeCount:
          type: integer
          minimum: 0
          description: |
            Envelopes queued for this server and not yet acked. The operator's
            view of a link that has stopped draining (spec section 9.4).
        plugin:
          oneOf: [{ $ref: "#/components/schemas/PluginDescriptor" }, { type: "null" }]
        session:
          oneOf: [{ $ref: "#/components/schemas/SessionSummary" }, { type: "null" }]

    PluginDescriptor:
      type: object
      description: What the plugin last said about itself. Advisory.
      properties:
        name: { type: string }
        version: { type: string }
        transports:
          type: array
          items: { type: string }

    SessionSummary:
      type: object
      description: The server's live session, or null when it has none.
      required: [id, expiresAt, pollTimeoutSeconds]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        pollTimeoutSeconds: { type: integer }

    ManifestRecord:
      type: object
      description: A server's stored manifest (spec section 6.5).
      required: [revision, publishedAt, manifest]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The accepted manifestRevision.
        publishedAt: { type: string, format: date-time }
        manifest:
          type: object
          additionalProperties: true
          description: |
            The accepted manifest.publish body, verbatim. Its shape is
            `manifest.schema.json#/$defs/manifestPublish`.

    ActionRecord:
      type: object
      description: One tracked job and everything that happened to it (spec section 7).
      required: [id, serverId, code, params, state, createdAt, expiresAt]
      properties:
        id: { type: string }
        serverId: { type: string }
        code: { type: string }
        context: { type: string }
        referenceKey: { type: string }
        params:
          type: object
          additionalProperties: true
        idempotencyKey: { type: string }
        state:
          type: string
          enum: [queued, delivered, running, completed, failed, expired]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        deliveredAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        runningAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        finishedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        ok:
          oneOf: [{ type: boolean }, { type: "null" }]
          description: Null until an action.result landed.
        result:
          description: The result payload the plugin reported, or null.
        error:
          oneOf: [{ type: string }, { type: "null" }]
        durationMs:
          oneOf: [{ type: integer }, { type: "null" }]

    EnrollmentToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: One-time enrollment token. Returned once, never retrievable again.
        expiresAt: { type: string, format: date-time }

    EventRecord:
      type: object
      description: One stored telemetry event (spec section 8.1).
      required: [id, serverId, type, occurredAt, receivedAt, data]
      properties:
        id:
          type: string
          description: Hub-assigned, opaque, and the tiebreak that makes the feed's order total.
        serverId: { type: string }
        type:
          type: string
          pattern: "^[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)+$"
          description: The event's `t`, core or custom alike.
        occurredAt:
          type: string
          format: date-time
          description: |
            When the game server says it happened, or the hub's receipt time
            when the plugin sent nothing usable.
        receivedAt:
          type: string
          format: date-time
          description: |
            When the hub took responsibility. Reported beside occurredAt rather
            than reconciled with it, so a clock discrepancy stays visible.
        data:
          type: object
          additionalProperties: true
          description: The payload the plugin sent; an empty object when it sent none.

    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/EventRecord" }
          description: Newest first, by occurredAt.
        nextCursor:
          type: string
          description: |
            Opaque position to resume from. Absent on the last page, which is
            how a client knows to stop without fetching an empty one.

    Scope:
      type: string
      maxLength: 160
      description: |
        One grant, `resource:verb` with an optional `:pattern` third field
        (spec section 10.1). Resources and verbs are a closed set; a pattern is
        `*`, a `{prefix}.*` namespace pattern, or an exact value.
      pattern: "^(admin|servers:read|webhooks:manage|(events:read|actions:read|actions:dispatch|kv:rw)(:(\\*|[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*(\\.\\*)?))?)$"
      example: "events:read:example-mod.*"

    AdminTokenRecord:
      type: object
      description: An Admin API credential as the API reports it. Never carries the secret.
      required: [id, name, scopes, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string }
        name:
          type: string
          description: Operator-facing label, copied onto every audit entry this token writes.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: string
          description: |
            Id of the token that minted this one. Absent when a bootstrap
            credential did, since that has no record of its own.
        expiresAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
          description: Null when the token does not expire on its own.
        revokedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
          description: Null while the token is live. The record outlives revocation.

    AuditRecord:
      type: object
      description: One authenticated mutation (spec section 10.5).
      required: [id, at, tokenId, tokenName, method, path, status, sourceIp, payloadDigest, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        tokenId:
          type: string
          description: Empty for a bootstrap credential, which has no token record.
        tokenName:
          type: string
          description: |
            What the credential was called at the time, so the entry stays
            readable after the token is renamed or deleted.
        method: { type: string }
        path: { type: string }
        status:
          type: integer
          description: The HTTP status the hub answered with. Refusals are recorded too.
        sourceIp:
          type: string
          description: |
            Peer address of the connection. Never taken from a forwarded
            header, which is whatever the client typed.
        payloadDigest:
          type: string
          description: SHA-256 of the request body in lowercase hex, empty when there was none.
        serverId:
          type: string
          description: Present when the mutation named or created a server.
        detail:
          type: object
          additionalProperties: true
          description: |
            What the mutation was, per route: the action code and resulting id
            for a dispatch, the granted scopes for a mint.

    AuditPage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
          description: Newest first, by `at`.
        nextCursor:
          type: string
          description: Opaque position to resume from. Absent on the last page.

    EventPattern:
      type: string
      maxLength: 128
      description: |
        A notification type pattern in the spec section 10.1 grammar: `*`, a
        `{prefix}.*` namespace pattern where the separating dot belongs to the
        prefix, or an exact type. Matches telemetry types and the lifecycle
        types (`action.completed`, `server.link.lost`, `server.link.restored`)
        alike.
      example: core.player.*

    WebhookRecord:
      type: object
      required: [id, url, events, serverIds, template, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
          description: The delivery target.
        events:
          type: array
          items: { $ref: "#/components/schemas/EventPattern" }
          description: Empty means every type.
        serverIds:
          type: array
          items: { type: string }
          description: Empty means every server.
        template:
          type: string
          enum: [generic-json]
        createdAt:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      required: [id, type, serverId, state, attempts, createdAt, deliveredAt]
      properties:
        id:
          type: string
          description: Stable across the delivery's attempts; the receiver deduplicates on it.
        type:
          type: string
          description: The notification type delivered.
        serverId:
          type: string
        state:
          type: string
          enum: [pending, delivered, dead]
          description: Dead is a state, not a deletion (spec section 11.5).
        attempts:
          type: integer
          minimum: 0
          description: Attempts made so far.
        lastStatus:
          type: integer
          description: The last HTTP status received. Absent when the last failure was transport-level.
        lastError:
          type: string
          description: Human-readable account of the last failure.
        createdAt:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
          description: Present while the delivery is pending.
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier; branch on this.
            message:
              type: string
              description: Human-readable. Never parse it.
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Malformed body, or a field missing, wrongly typed, or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, unknown, revoked, or expired admin token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        A valid credential without the scope this call needs (spec section
        10.2). Distinct from 401 on purpose: the caller authenticated, and
        retrying with the same token will not help.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
