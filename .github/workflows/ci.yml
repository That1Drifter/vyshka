name: CI

# Three jobs in parallel, because the hub conformance suite holds real
# long-polls and waits out real TTLs (about five minutes a pass) and nothing
# it grades depends on the Go suite or on the other database:
#
#   test                        gofmt, vet, go test (SQLite and Postgres), spec documents
#   conformance-sqlite          the hub suite against the built binary on SQLite,
#                               and the plugin suite against the reference driver
#   conformance-postgres        the hub suite against a hub on Postgres; pushes to
#                               main only, so a pull request waits for one pass
#                               and main is still graded on both databases before
#                               anything is tagged (the Go suite covers the store
#                               on Postgres for every pull request)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The Postgres backend is graded against a real server: the Go suite
      # creates a throwaway database per test through this maintenance
      # connection. The credential is not a secret: the server exists for
      # one job and listens on the runner's loopback.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyshka
          POSTGRES_PASSWORD: vyshka_ci_password_not_a_secret
          POSTGRES_DB: vyshka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyshka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # The panel's end-to-end test drives the headless Chrome the runner
          # image ships. Required here so a missing browser fails the job
          # instead of silently skipping the one test that grades the panel.
          VYSHKA_E2E: required
        run: go test ./...

      - name: Test the hub against Postgres
        # The same hub and store suites, each test on a database of its own,
        # with the pool above one connection so the row locks are what keeps
        # the overlap tests honest. Only the hub packages: nothing else opens
        # a database.
        env:
          VYSHKA_E2E: required
          VYSHKA_TEST_BACKEND: postgres
          VYSHKA_TEST_POSTGRES_URL: postgres://vyshka:vyshka_ci_password_not_a_secret@localhost:5432/vyshka
        run: go test ./hub/...

      - name: Validate the spec documents
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import json, sys, yaml

          def load(path):
              if path.endswith(".json"):
                  return json.load(open(path, encoding="utf-8"))
              return yaml.safe_load(open(path, encoding="utf-8"))

          for path in ("spec/openapi-admin.yaml", "spec/openapi-plugin.yaml",
                       "spec/envelopes.schema.json", "spec/manifest.schema.json",
                       "spec/actions.schema.json", "spec/events.schema.json",
                       "spec/state.schema.json"):
              document = load(path)
              refs = []
              def walk(node):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          refs.append(value) if key == "$ref" else walk(value)
                  elif isinstance(node, list):
                      for item in node:
                          walk(item)
              walk(document)
              for ref in sorted(set(refs)):
                  if not ref.startswith("#"):
                      sys.exit(f"{path}: $ref {ref} leaves the document; keep every ref local")
                  target = document
                  for part in ref.lstrip("#/").split("/"):
                      if part not in target:
                          sys.exit(f"{path}: unresolved $ref {ref}")
                      target = target[part]
              print(f"{path}: ok, {len(set(refs))} refs resolved")
          PY

  conformance-sqlite:
    name: Conformance on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o bin/vyshka-hub ./hub/cmd/vyshka-hub

      - name: Run the hub conformance suite against a live hub on SQLite
        env:
          # Not a secret: this hub exists for the length of one job and listens
          # on loopback. The suite needs a known admin token to grade the
          # Admin API realm at all.
          VYSHKA_ADMIN_TOKEN: vya_ci_admin_token_not_a_secret
        run: |
          ./bin/vyshka-hub serve -addr 127.0.0.1:8080 -db "$RUNNER_TEMP/ci.db" &
          hub_pid=$!
          trap 'kill "$hub_pid" 2>/dev/null || true' EXIT
          go run ./conformance/hub -url http://127.0.0.1:8080 -wait 30s

      - name: Run the plugin conformance suite against the reference driver
        run: go run ./conformance/plugin -- go run ./conformance/plugin/driver

      - name: Run the plugin conformance suite as an older hub against an opaque-error driver
        # The mock ignores the inline-errors opt-in and the driver discards the
        # status and body of every non-2xx, which is what an engine like DayZ's
        # leaves a plugin with. This grades the fallback path of spec Appendix A.
        run: go run ./conformance/plugin -legacy-errors -- go run ./conformance/plugin/driver -opaque

      - name: Run the plugin conformance suite against a driver that reads ordinary errors without opting in
        # The third kind of plugin: one whose HTTP client can read a 4xx body,
        # so it never asks for inline errors and still follows the recovery
        # table. The stages must grade what the plugin did, not how the
        # refusal travelled.
        run: go run ./conformance/plugin -- go run ./conformance/plugin/driver -inline=false

  conformance-postgres:
    name: Conformance on Postgres
    # Pushes only, which the trigger limits to main: the pass takes as long
    # as the SQLite one and grades the same checks against the other system
    # of record, so main carries it and a pull request does not wait for it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyshka
          POSTGRES_PASSWORD: vyshka_ci_password_not_a_secret
          POSTGRES_DB: vyshka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyshka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o bin/vyshka-hub ./hub/cmd/vyshka-hub

      - name: Run the hub conformance suite against a live hub on Postgres
        # The same suite, the same checks, against a hub whose system of
        # record is the Postgres service, on a fresh database.
        env:
          VYSHKA_ADMIN_TOKEN: vya_ci_admin_token_not_a_secret
        run: |
          ./bin/vyshka-hub serve -addr 127.0.0.1:8081 -db "postgres://vyshka:vyshka_ci_password_not_a_secret@localhost:5432/vyshka" &
          hub_pid=$!
          trap 'kill "$hub_pid" 2>/dev/null || true' EXIT
          go run ./conformance/hub -url http://127.0.0.1:8081 -wait 30s
