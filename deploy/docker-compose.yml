# A single-host hub behind a reverse proxy, the reference deployment of
# spec/protocol.md section 3.3. Run from this directory:
#
#   printf 'vya_%s' "$(openssl rand -hex 24)" > admin-token
#   chmod 0400 admin-token && sudo chown 65532:65532 admin-token   # the container's user
#   mkdir -p data && sudo chown 65532:65532 data
#   docker compose up -d --build
#
# The hub listens on loopback only; TLS and the public name belong to the
# proxy in front (see nginx-vyshka.conf.example). Read the admin token back
# from the file when you need it; the hub never logs a configured token.
#
# To front the hub from an nginx that runs in another compose project, add
# an override that joins that project's network instead of publishing a
# port (networks: web: external: true, name: <project>_default) and proxy to
# the container name; the hub's own defaults do not change.
services:
  hub:
    build:
      context: ..
    image: vyshka-hub:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      VYSHKA_ADMIN_TOKEN: file:/run/secrets/admin_token
    secrets:
      - admin_token
    # The hub drains held polls for up to 15 s on SIGTERM; compose's default
    # 10 s would kill it mid-drain.
    stop_grace_period: 30s
    # A budget, so a misbehaving client cannot make the hub crowd out
    # whatever shares the host: the hub's own bounds are per connection and
    # per request, not a memory ceiling.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2
    pids_limit: 256
    # One JSON line per request (including unauthenticated ones), rotated.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin_token:
    file: ./admin-token
