// Vyshka spike server config: minimal offline server whose only job is to run
// the RestApi probe in the mission init.c. Copy next to serverDZ.cfg in the
// DayZServer install and start with:
//   DayZServer_x64.exe -config=vyshka_spike_serverDZ.cfg -port=2402 -profiles=<spike>/results/profile -dologs -adminlog
hostname = "vyshka-spike";
password = "";
passwordAdmin = "";
description = "RestApi long-poll timeout spike";

enableWhitelist = 0;
maxPlayers = 1;

verifySignatures = 0;
forceSameBuild = 1;

disableVoN = 1;
vonCodecQuality = 20;

shardId = "spike1";

disable3rdPerson = 0;
disableCrosshair = 0;

disablePersonalLight = 1;
lightingConfig = 0;

serverTime = "SystemTime";
serverTimeAcceleration = 1;
serverNightTimeAcceleration = 1;
serverTimePersistent = 0;

guaranteedUpdates = 1;

loginQueueConcurrentPlayers = 1;
loginQueueMaxPlayers = 5;

instanceId = 9;
storageAutoFix = 1;

class Missions
{
    class DayZ
    {
        template = "vyshkaSpike.chernarusplus";
    };
};
